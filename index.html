<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@snipezqc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161b;
    --panel-border: #232a31;
    --mint: #3ddc97;
    --red: #ff4d6d;
    --midnight-purple: #4b2e83;
    --text: #edeff1;
    --muted: #7c8791;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: inherit; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
  }
  html, body { height: 100%; }
  .wrap {
    width: 100%;
    max-width: 420px;
    padding: 48px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- avatar --- */
  .reticle {
    margin-bottom: 22px;
    flex-shrink: 0;
    animation: spin-in 0.9s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes spin-in {
    from { transform: scale(0.9); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .reticle .core img {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .handle {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.5px;
    margin: 0;
    line-height: 1.1;
  }
  .handle span { color: var(--midnight-purple); }
  .tag {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
    margin: 6px 0 4px;
  }
  .bio {
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.55;
    text-align: center;
    max-width: 300px;
    margin: 10px 0 34px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 18px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 15.5px;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .link:hover, .link:focus-visible {
    transform: translateX(4px);
    border-color: var(--mint);
    background: #161c22;
  }
  .link:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  .link .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--mint);
    object-fit: contain;
  }
  .link .name { flex: 1; }
  .link .go {
    color: var(--muted);
    font-size: 13px;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 1px;
  }
  .link.accent .icon { color: var(--red); }

  footer {
    margin-top: 40px;
    color: var(--panel-border);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .reticle { animation: none; }
    .link { transition: none; }
  }
</style>
</head>
